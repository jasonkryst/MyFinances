server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text-based responses (text/html is always compressed by nginx
    # when gzip is on, regardless of gzip_types)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # The backend is optional -- local-only mode must keep working when
    # this container runs without it. A literal proxy_pass hostname makes
    # nginx resolve it once at config-load time and refuse to start at all
    # if it's not resolvable; resolving through a variable at request time
    # instead means a missing backend only 502s /api and /auth, not the
    # whole container. 127.0.0.11 is Docker's embedded DNS server, reachable
    # on any user-defined bridge network.
    #
    # IMPORTANT: proxy_pass must NOT include a URI path component when using
    # a variable (e.g. $backend_upstream/api/ is wrong). When proxy_pass
    # contains a variable, nginx sends only the literal proxy_pass URI and
    # drops the remainder of the request URI -- /auth/login becomes /auth/,
    # /api/plan-settings becomes /api/, etc. Using just $backend_upstream
    # (no path) causes nginx to forward the full original request URI intact.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream http://server:4000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        set $backend_upstream http://server:4000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # These files use stable names between releases. Revalidate them on each
    # visit so Chrome cannot keep an older HTML, JS, CSS, manifest, or worker.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Image and font URLs are not executable app-shell assets and can be
    # cached aggressively without preventing a release from loading.
    location ~* \.(svg|png|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
