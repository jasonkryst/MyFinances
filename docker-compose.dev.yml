# Dev override: serve the working tree straight from nginx so edits show up on
# refresh without rebuilding the image.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# nginx's html root is /usr/share/nginx/html (see Dockerfile).
# env-config.js is deliberately not mounted: nginx.conf aliases /env-config.js to
# /tmp/env-config.js, which docker-entrypoint.d/40-ga-env-config.sh regenerates on every
# container start, so the committed placeholder would never be served here anyway.
# Verified live (7.29.x, Docker Desktop on Windows): the bind mounts work, an edited file is
# served on the next request. The service worker serves precached assets cache-first, so
# bump CACHE_NAME in sw.js (or unregister the worker) to see an edited asset in the browser.
services:
  myfinances:
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./guide.html:/usr/share/nginx/html/guide.html:ro
      - ./src:/usr/share/nginx/html/src:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./styles-csp-classes.css:/usr/share/nginx/html/styles-csp-classes.css:ro
      - ./guide.css:/usr/share/nginx/html/guide.css:ro
      - ./sw.js:/usr/share/nginx/html/sw.js:ro
      - ./manifest.json:/usr/share/nginx/html/manifest.json:ro
      - ./icons:/usr/share/nginx/html/icons:ro
