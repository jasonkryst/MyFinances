name: Accessibility barrier
description: Something is hard or impossible to use with a keyboard, screen reader, zoom or other assistive technology.
title: "a11y: "
labels: ["accessibility", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us. You don't need to know which WCAG rule is involved; describing what got in your way is enough.
        See [ACCESSIBILITY.md](https://github.com/jasonkryst/MyFinances/blob/main/ACCESSIBILITY.md) for what we support and what's already known.
        If you'd rather not post publicly, email jasonkryst+github@gmail.com.
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      placeholder: Add a new debt from the Liabilities page.
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way?
      description: What happened, what you heard or saw, and what you expected.
      placeholder: After pressing Save, the screen reader announced nothing and focus jumped to the top of the page.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: How much does it affect you?
      options:
        - I can't complete the task at all
        - I can complete it, but it's difficult
        - It's an annoyance
    validations:
      required: true
  - type: dropdown
    id: assistive-tech
    attributes:
      label: What were you using?
      multiple: true
      options:
        - Keyboard only
        - Screen reader
        - Screen magnifier or browser zoom
        - Voice control
        - High contrast or dark theme
        - Reduced motion
        - Switch access
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system and assistive technology versions
      placeholder: Firefox 142, Windows 11, NVDA 2026.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MyFinances version
      description: Shown in the app footer (for example 7.3.0), if you can find it.
