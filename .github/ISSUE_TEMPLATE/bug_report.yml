name: Bug report
description: Something in MyFinances doesn't work the way it should.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this!

        **Don't include real financial data or passwords.** Replace names and amounts with made-up ones.
        Security problems go to a [private advisory](https://github.com/jasonkryst/MyFinances/security/advisories/new), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Go to Accounts
        2. Add a Checking account with a starting balance of 100
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MyFinances version
      description: Shown in the app footer (for example 7.3.0).
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - Docker image (Docker Hub or GHCR)
        - Built from source with docker compose
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 140 on Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: |
        Anything from the browser console (F12) or `docker compose logs server`. Remove anything private first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this hasn't been reported.
          required: true
        - label: I removed any real financial data, passwords or tokens from this report.
          required: true
