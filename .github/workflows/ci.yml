name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Shared Python/Playwright setup used by every browser-test job.
# Kept inline (no composite action) so the workflow is self-contained.
# Change the cache key suffix (e.g. -v2) to bust stale Playwright binaries.

jobs:
  # ---------------------------------------------------------------------------
  # Features — 7 parallel shards. A/F/G split by slow-test file (~25s/test).
  # ---------------------------------------------------------------------------
  test-features-a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/requirements.txt') }}
      - run: pip install -r tests/requirements.txt
      - run: playwright install --with-deps chromium
      - name: Start static server
        run: |
          python -m http.server 32900 > /tmp/http-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:32900/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:32900/ > /dev/null || exit 1
      - run: |
          pytest \
            tests/features/test_debts.py \
            tests/features/test_strategy.py \
            -v

  # test_ledger: 18 slow tests (~25s each in CI); isolated to its own shard.
  test-features-f:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
