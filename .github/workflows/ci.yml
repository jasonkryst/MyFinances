          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/requirements.txt') }}
      - run: pip install -r tests/requirements.txt
      - uses: ./.github/actions/install-playwright
      - uses: ./.github/actions/start-stack
      - run: pytest tests/security --maxfail=15 -v
      - name: Stop stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Postgres (full stack; ~2 min of pytest, so it gets the same 15 min as every Playwright job)
  # ---------------------------------------------------------------------------
  test-postgres:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.mailpit.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/requirements.txt') }}
      - run: pip install -r tests/requirements.txt
      - uses: ./.github/actions/install-playwright
      - uses: ./.github/actions/start-stack
      - name: Run Postgres bootstrap tests
        run: pytest tests/postgres --maxfail=15 -v
      - name: Stop stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Accessibility audit
  # ---------------------------------------------------------------------------
  test-a11y:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/requirements.txt') }}
      - run: pip install -r tests/requirements.txt
      - uses: ./.github/actions/install-playwright
      - uses: ./.github/actions/start-stack
      - run: pytest tests/a11y --maxfail=15 -v
      - name: Stop stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Server node:test suite (server/test/*.test.js) against a real Postgres
  # service container — never mocked (see server/README.md "Tests").
  # ---------------------------------------------------------------------------
  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: myfinances_test
          POSTGRES_PASSWORD: myfinances_test
          POSTGRES_DB: myfinances_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myfinances_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://myfinances_test:myfinances_test@localhost:5432/myfinances_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: New migrations must sort after the base branch's newest
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          sh server/scripts/check-migration-order.sh "origin/${{ github.base_ref }}"
      - run: npm ci
      - run: npm run migrate up
      - run: npm test

  # ---------------------------------------------------------------------------
  # Mutation testing — split so unit-test feedback is instant on every PR
  # while the slow Stryker run only gates merges to main
  # ---------------------------------------------------------------------------
  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  mutation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/mutation.html

  # ---------------------------------------------------------------------------
  # Docker image build smoke-test
  # ---------------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t myfinances:ci .

  # ---------------------------------------------------------------------------
  # Lighthouse performance audit
  # ---------------------------------------------------------------------------
  lighthouse:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Chrome for Lighthouse CI
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - uses: ./.github/actions/start-stack
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Stop stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Single required status check (issue #380). The main ruleset requires this
  # job (plus CodeQL/Trivy/dependency-review, which live in other workflows)
  # instead of listing every job by name, so a new job can't silently go
  # ungated -- add it to `needs` below. tests/features/test_ci_shard_coverage.py
  # fails CI if any job in this file is missing from `needs`.
  # `if: always()` makes it run and report even when a dependency fails; a
  # skipped dependency counts as success. mutation-testing is deliberately
  # excluded: it only runs after merge to main, so it can't gate a PR.
  # ---------------------------------------------------------------------------
  ci-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - build-images
      - test-features-a
      - test-features-b
      - test-features-c
      - test-features-d
      - test-features-e
      - test-features-f
      - test-features-g
      - test-features-h
      - test-features-i
      - test-features-j
      - test-features-k
      - test-features-l
      - test-features-m
      - test-integration
      - test-ui-a
      - test-ui-b
      - test-ui-c
      - test-ui-d
      - test-security
      - test-postgres
      - test-a11y
      - test-server
      - test-unit
      - docker-build
      - lighthouse
    steps:
      - name: Fail if any CI job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | grep -E '"result"' || true
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "::error::One or more CI jobs failed or were cancelled -- see the list above."
            exit 1
          fi
          echo "All CI jobs passed or were skipped."
