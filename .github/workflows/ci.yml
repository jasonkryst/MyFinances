      - name: Start static server
        run: |
          python -m http.server 32900 > /tmp/http-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:32900/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:32900/ > /dev/null || exit 1
      - run: pytest tests/features/test_reconciliation.py -v

  # test_reports, test_debt_calculator, test_break_even, test_networth are
  # calculation-heavy tests (~20s each in CI vs ~3s for shard-B/C). Kept in
  # their own shard so shard A stays under 20 min.
  test-features-e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
