      - run: pytest tests/security -v

  # ---------------------------------------------------------------------------
  # Postgres (full stack — longer timeout is justified)
  # ---------------------------------------------------------------------------
  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/requirements.txt') }}
      - run: pip install -r tests/requirements.txt
      - run: playwright install --with-deps chromium
      - name: Create postgres secret
        run: |
          mkdir -p secrets
          echo "ci-test-password" > secrets/postgres_password.txt
      - name: Start full stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:32900/ > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:32900/ > /dev/null || exit 1
          for i in $(seq 1 30); do
            docker inspect --format='{{.State.Health.Status}}' myfinances-server 2>/dev/null | grep -q "^healthy$" && break
            sleep 2
          done
      - name: Run migrations
        run: docker compose run --rm server npm run migrate up
      - name: Seed test user
        run: printf "testuser@example.com\nci-test-password\n" | docker compose run --rm -T server node scripts/create-user.js
      - name: Run Postgres bootstrap tests
        env:
          POSTGRES_TEST_BASE_URL: http://localhost:32900
          POSTGRES_TEST_EMAIL: testuser@example.com
          POSTGRES_TEST_PASSWORD: ci-test-password
        run: pytest tests/postgres -v
      - name: Stop stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Accessibility audit
  # ---------------------------------------------------------------------------
  test-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/requirements.txt') }}
      - run: pip install -r tests/requirements.txt
      - run: playwright install --with-deps chromium
      - name: Start static server
        run: |
          python -m http.server 32900 > /tmp/http-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:32900/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:32900/ > /dev/null || exit 1
      - run: pytest tests/a11y -v

  # ---------------------------------------------------------------------------
  # Mutation testing — split so unit-test feedback is instant on every PR
  # while the slow Stryker run only gates merges to main
  # ---------------------------------------------------------------------------
  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  mutation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/mutation.html

  # ---------------------------------------------------------------------------
  # Docker image build smoke-test
  # ---------------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t myfinances:ci .

  # ---------------------------------------------------------------------------
  # Lighthouse performance audit
  # ---------------------------------------------------------------------------
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Chrome for Lighthouse CI
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Start app container
        run: |
          docker compose up -d --build myfinances
          for i in $(seq 1 30); do
            curl -sf http://localhost:32900/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:32900/ > /dev/null || exit 1
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Stop app container
        if: always()
        run: docker compose down
