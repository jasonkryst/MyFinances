            tests/features/test_main_nav_groups.py \
            tests/features/test_reports_nav_groups.py \
            tests/features/test_issue_92_export.py \
            tests/features/test_issue_93_expense_save.py \
            tests/features/test_validation_modals.py \
            -v

  # ---------------------------------------------------------------------------
  # Integration
  # ---------------------------------------------------------------------------
  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
