name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-features:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install playwright pytest pytest-asyncio
      - run: playwright install --with-deps chromium
      - name: Start static server
        run: |
          python -m http.server 5500 > /tmp/http-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5500/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5500/ > /dev/null || exit 1
      - run: pytest tests/features -v

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install playwright pytest pytest-asyncio
      - run: playwright install --with-deps chromium
      - name: Start static server
        run: |
          python -m http.server 5500 > /tmp/http-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5500/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5500/ > /dev/null || exit 1
      - run: pytest tests/integration -v

  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install playwright pytest pytest-asyncio
      - run: playwright install --with-deps chromium
      - name: Start static server
        run: |
          python -m http.server 5500 > /tmp/http-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5500/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5500/ > /dev/null || exit 1
      - run: pytest tests/ui -v

  test-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install playwright pytest pytest-asyncio
      - run: playwright install --with-deps chromium
      - name: Start static server
        run: |
          python -m http.server 5500 > /tmp/http-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5500/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5500/ > /dev/null || exit 1
      - run: pytest tests/security -v

  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install playwright pytest pytest-asyncio
      - run: playwright install --with-deps chromium
      - name: Create postgres secret
        run: |
          mkdir -p secrets
          echo "ci-test-password" > secrets/postgres_password.txt
      - name: Start full stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:5500/ > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:5500/ > /dev/null || exit 1
          for i in $(seq 1 30); do
            docker inspect --format='{{.State.Health.Status}}' myfinances-server 2>/dev/null | grep -q "^healthy$" && break
            sleep 2
          done
      - name: Run migrations
        run: docker compose run --rm server npm run migrate up
      - name: Seed test user
        run: printf "testuser@example.com\nci-test-password\n" | docker compose run --rm -T server node scripts/create-user.js
      - name: Run Postgres bootstrap tests
        env:
          POSTGRES_TEST_BASE_URL: http://localhost:5500
          POSTGRES_TEST_EMAIL: testuser@example.com
          POSTGRES_TEST_PASSWORD: ci-test-password
        run: pytest tests/postgres -v
      - name: Stop stack
        if: always()
        run: docker compose down -v

  test-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install playwright pytest pytest-asyncio
      - run: playwright install --with-deps chromium
      - name: Start static server
        run: |
          python -m http.server 5500 > /tmp/http-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5500/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5500/ > /dev/null || exit 1
      - run: pytest tests/a11y -v

  mutation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/mutation.html

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t myfinances:ci .

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t myfinances:ci .
      - name: Vulnerability gate (fixable CRITICAL/HIGH findings)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: myfinances:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
      - name: Full vulnerability report (all severities, including unfixed)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: myfinances:ci
          format: sarif
          output: trivy-results.sarif
      - name: Upload scan results to the Security tab
        if: always() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Chrome for Lighthouse CI
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Start app container
        run: |
          docker compose up -d --build myfinances
          for i in $(seq 1 30); do
            curl -sf http://localhost:5500/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5500/ > /dev/null || exit 1
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Stop app container
        if: always()
        run: docker compose down
