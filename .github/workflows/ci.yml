name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Shared Python/Playwright setup used by every browser-test job.
# Kept inline (no composite action) so the workflow is self-contained.
# Change the cache key suffix (e.g. -v2) to bust stale Playwright binaries.

jobs:
  # ---------------------------------------------------------------------------
  # Build the nginx + server images once; every Playwright job loads them via
  # .github/actions/start-stack instead of rebuilding.
  # ---------------------------------------------------------------------------
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          mkdir -p secrets
          echo "ci-db-password" > secrets/postgres_password.txt
          : > secrets/smtp_password.txt
          docker compose build
      - name: Save images
        run: docker save myfinances:latest myfinances-server:latest | zstd -T0 > images.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: stack-images
          path: images.tar.zst
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Features — 12 parallel shards (a-l), bin-packed by measured pytest seconds
  # (not test count): keep every shard under ~360 s of pytest (~7.5 min job
  # including the ~90 s of setup), well inside the 15 min job timeout (#527).
  # Per-file seconds come from the per-test timestamps in a green run's job log.
  # F/G hold the slow ledger/reconciliation files; I holds test_performance;
  # K holds the static guards (CLAUDE.md names it); L and M are the i18n render guard.
  # Every pytest job passes --maxfail=15 so a broken stack stops the job early
  # (#551); the per-test 120 s timeout comes from pytest.ini (pytest-timeout).
  # ---------------------------------------------------------------------------
  test-features-a:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/requirements.txt') }}
      - run: pip install -r tests/requirements.txt
      - uses: ./.github/actions/install-playwright
      - uses: ./.github/actions/start-stack
      - run: |
          pytest \
            tests/features/test_debts.py \
            tests/features/test_strategy.py \
            tests/features/test_plan_history.py \
            tests/features/test_filter_sort.py \
            tests/features/test_account_menu.py \
            --maxfail=15 \
            -v
      - name: Stop stack
        if: always()
        run: docker compose down -v

  # test_ledger: 18 slow tests (~25s each in CI); isolated to its own shard.
  test-features-f:
