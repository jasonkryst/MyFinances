        run: |
          python -m http.server 32900 > /tmp/http-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:32900/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:32900/ > /dev/null || exit 1
      - run: pytest tests/features/test_ledger.py -v

  # test_reconciliation: 13 slow tests (~25s each in CI); isolated to its own shard.
  test-features-g:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
