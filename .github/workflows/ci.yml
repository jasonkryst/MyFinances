      - run: pip install -r tests/requirements.txt
      - run: playwright install --with-deps chromium
      - name: Start static server
        run: |
          python -m http.server 32900 > /tmp/http-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:32900/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:32900/ > /dev/null || exit 1
      - run: |
          pytest \
            tests/features/test_reports.py \
            tests/features/test_debt_calculator.py \
            tests/features/test_break_even.py \
            tests/features/test_networth.py \
            -v

  # test_accounts (27 tests, multi-modal deletion flows) and test_forecast
