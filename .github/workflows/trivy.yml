name: Trivy Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan at 03:00 UTC on Mondays — catches newly-disclosed CVEs
    # even during quiet weeks with no PRs.
    - cron: '0 3 * * 1'

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t myfinances:ci .

      # -- Docker image scan ---------------------------------------------------
      - name: Image -- vulnerability gate (fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: myfinances:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          trivy-config: trivy.yaml
      - name: Image -- full report (all severities, SARIF)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: myfinances:ci
          format: sarif
          output: trivy-image.sarif
          trivy-config: trivy.yaml
      - name: Image -- upload to Security tab
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # -- Filesystem scan (secrets gate + full vuln/secret SARIF report) ------
      - name: Filesystem -- secret gate (block on hardcoded secrets in source)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          scanners: secret
          format: table
          exit-code: 1
          trivy-config: trivy.yaml
      - name: Filesystem -- full report (vuln + secret, all severities, SARIF)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          scanners: vuln,secret
          format: sarif
          output: trivy-fs.sarif
          trivy-config: trivy.yaml
      - name: Filesystem -- upload to Security tab
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # -- IaC / misconfiguration scan -----------------------------------------
      - name: IaC -- misconfiguration report (SARIF, informational)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: '.'
          format: sarif
          output: trivy-iac.sarif
          trivy-config: trivy.yaml
      - name: IaC -- upload to Security tab
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
