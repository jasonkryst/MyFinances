services:
  myfinances:
    build:
      context: .
      dockerfile: Dockerfile
    image: myfinances:latest
    container_name: myfinances
    ports:
      - "32900:80"
    restart: unless-stopped
    # Uncomment to cap CPU/memory on shared hosts. Conservative starting
    # points for a single-user self-hosted deployment.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.50'
    #       memory: 64M
    environment:
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      REFRESH_ON_FOCUS_SECONDS: ${REFRESH_ON_FOCUS_SECONDS:-}
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: myfinances-postgres
    restart: unless-stopped
    # Uncomment to cap CPU/memory on shared hosts.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.50'
    #       memory: 256M
    environment:
      POSTGRES_DB: myfinances
      POSTGRES_USER: myfinances
      # Since 8.0.0 the database password is this variable (.env, a Portainer
      # stack variable or the shell); secrets/postgres_password.txt is no longer
      # read. Postgres applies it only when the data volume is first created.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or your stack variables (see DEPLOYMENT.md)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfinances -d myfinances"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: myfinances-server:latest
    container_name: myfinances-server
    restart: unless-stopped
    # Uncomment to cap CPU/memory on shared hosts.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.50'
    #       memory: 256M
    environment:
      SESSION_TTL_DAYS: "7"
      # docker-entrypoint.sh builds DATABASE_URL from this (8.0.0).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or your stack variables (see DEPLOYMENT.md)}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      # Since 8.0.0 the SMTP password is this variable (in .env, a Portainer
      # stack variable or the shell); secrets/smtp_password.txt is no longer read.
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # Set ALLOW_SETUP=true in the environment ONLY during initial account creation.
      # Remove it (or restart the server without it) after setup is complete.
      ALLOW_SETUP: "${ALLOW_SETUP:-}"
      # Issue #456: check new passwords against Have I Been Pwned (k-anonymity;
      # only a 5-character hash prefix leaves the server). Off by default; it
      # fails open, so it is safe to enable on a box with flaky egress.
      SECURITY_CHECK_BREACHED_PASSWORDS: "${SECURITY_CHECK_BREACHED_PASSWORDS:-false}"
      SECURITY_BREACH_CHECK_URL: "${SECURITY_BREACH_CHECK_URL:-}"
      # Issue #579: background jobs (monthly net-worth snapshot for users who
      # turned on auto-capture, hourly pruning of expired sessions). On by
      # default; set JOBS_ENABLED=false to turn them off. Periods use the
      # server's local time: set TZ (e.g. Europe/Warsaw) to change it from UTC.
      JOBS_ENABLED: "${JOBS_ENABLED:-true}"
      TZ: "${TZ:-UTC}"
      # Reverse proxies in front of the server: 1 = just the bundled nginx.
      # Behind another proxy (Traefik, Nginx Proxy Manager, Caddy, a tunnel)
      # set 2, or every visitor shares one login rate limit. Never set it
      # higher than the real count (it would let clients forge their address).
      TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-1}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  backup:
    image: postgres:16-alpine
    container_name: myfinances-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_SCHEDULE: "${BACKUP_SCHEDULE:-0 2 * * *}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
      # BACKUP_SCHEDULE is read in this time zone (the same TZ as the server's
      # jobs, default UTC); dump file names use it too.
      TZ: "${TZ:-UTC}"
      # pg_dump's password (8.0.0). busybox crond passes the container's
      # environment to each scheduled run.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or your stack variables (see DEPLOYMENT.md)}
    volumes:
      - backup-data:/backups
      - ./server/scripts/docker-backup.sh:/usr/local/bin/docker-backup.sh:ro
      - ./server/scripts/backup-entrypoint.sh:/usr/local/bin/backup-entrypoint.sh:ro
    # A list, not a folded `>` block: YAML keeps the line breaks before
    # more-indented lines, which split the old `sh -c` chain and crash-looped
    # this container (#656). No args: cron in the foreground; with args
    # (`docker compose run --rm backup sh /usr/local/bin/docker-backup.sh`)
    # it runs them instead.
    entrypoint: ["sh", "/usr/local/bin/backup-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x crond > /dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  backup-data: