services:
  myfinances:
    build:
      context: .
      dockerfile: Dockerfile
    image: myfinances:latest
    container_name: myfinances
    ports:
      - "32900:80"
    restart: unless-stopped
    # Uncomment to cap CPU/memory on shared hosts. Conservative starting
    # points for a single-user self-hosted deployment.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.50'
    #       memory: 64M
    environment:
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: myfinances-postgres
    restart: unless-stopped
    # Uncomment to cap CPU/memory on shared hosts.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.50'
    #       memory: 256M
    environment:
      POSTGRES_DB: myfinances
      POSTGRES_USER: myfinances
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfinances -d myfinances"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: myfinances-server:latest
    container_name: myfinances-server
    restart: unless-stopped
    # Uncomment to cap CPU/memory on shared hosts.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.50'
    #       memory: 256M
    environment:
      SESSION_TTL_DAYS: "7"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # Set ALLOW_SETUP=true in the environment ONLY during initial account creation.
      # Remove it (or restart the server without it) after setup is complete.
      ALLOW_SETUP: "${ALLOW_SETUP:-}"
    secrets:
      - postgres_password
      - smtp_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  backup:
    image: postgres:16-alpine
    container_name: myfinances-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_SCHEDULE: "${BACKUP_SCHEDULE:-0 2 * * *}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
    volumes:
      - backup-data:/backups
      - ./server/scripts/docker-backup.sh:/usr/local/bin/docker-backup.sh:ro
    secrets:
      - postgres_password
    entrypoint: >
      sh -c 'echo "$${BACKUP_SCHEDULE} /usr/local/bin/docker-backup.sh >> /var/log/backup.log 2>&1"
             > /etc/crontabs/root
             && chmod +x /usr/local/bin/docker-backup.sh
             && crond -f -l 2'
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  backup-data:

secrets:
  postgres_password:
    file: ${POSTGRES_SECRET_FILE:-./secrets/postgres_password.txt}
  smtp_password:
    file: ${SMTP_SECRET_FILE:-./secrets/smtp_password.txt}