services:
  myfinances:
    build:
      context: .
      dockerfile: Dockerfile
    image: myfinances:latest
    container_name: myfinances
    ports:
      - "32900:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: myfinances-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: myfinances
      POSTGRES_USER: myfinances
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfinances -d myfinances"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: myfinances-server:latest
    container_name: myfinances-server
    restart: unless-stopped
    environment:
      SESSION_TTL_DAYS: "7"
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:

secrets:
  postgres_password:
    file: ${POSTGRES_SECRET_FILE:-./secrets/postgres_password.txt}
